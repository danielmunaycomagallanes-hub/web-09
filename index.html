<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar md:navbar-expand bg-1">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Tarea 09</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer"
                aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body mb-2 md:mb-0">
                    <ul class="nav navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Productos</a>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" type="button" data-bs-toggle="menu" aria-expanded="false">
                                Mas cosas
                            </button>
                            <div class="menu">
                                <a class="menu-item" href="#">Clientes</a>
                                <a class="menu-item" href="#">proveedores</a>
                                <hr class="menu-divider">
                                <a class="menu-item" href="#">reportes</a>
                            </div>
                        </li>
                    </ul>
                    <form class="hstack gap-2" role="search">
                        <input class="form-control" type="search" placeholder="Buscar" aria-label="Buscar" />
                        <button class="btn-solid btn-icon theme-secondary" type="submit" aria-label="Buscar">
                            <i class=" bi bi-search"></i>
                        </button>
                    </form>
                </div>
            </dialog>
        </div>
    </nav>

    <main class="container my-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4 mb-0">Productos</h1>
            <button type="button" class="btn-solid theme-primary" data-bs-toggle="dialog"
                data-bs-target="#dialogProducto">
                <i class="bi bi-plus-lg"></i>Nuevo Poducto
            </button>
        </div>

        
        <table class="table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Producto</th>
                    <th>Categoria</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Laptop</td>
                    <td>Tecnologicas</td>
                    <td>S/2000</td>
                    <td>12</td>
                    <td><button type="button" class="btn-solid theme-warning btn-sm" data-bs-toggle="dialog"
                            data-bs-target="#dialogProducto">
                            <i class="bi bi-pencil"></i> Editar
                        </button>
                        <button type="button" class="btn-solid theme-danger btn-sm">
                            <i class="bi bi-trash"></i> Eliminar
                        </button>
                    </td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Mouse</td>
                    <td>Tecnologicas</td>
                    <td>S/70</td>
                    <td>10</td>
                    <td><button type="button" class="btn-solid theme-warning btn-sm" data-bs-toggle="dialog"
                            data-bs-target="#dialogProducto">
                            <i class="bi bi-pencil"></i> Editar
                        </button>
                        <button type="button" class="btn-solid theme-danger btn-sm">
                            <i class="bi bi-trash"></i> Eliminar
                        </button>
                    </td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Monitor</td>
                    <td>Tecnologicas</td>
                    <td>S/1000</td>
                    <td>8</td>
                    <td><button type="button" class="btn-solid theme-warning btn-sm" data-bs-toggle="dialog"
                            data-bs-target="#dialogProducto">
                            <i class="bi bi-pencil"></i> Editar
                        </button>
                        <button type="button" class="btn-solid theme-danger btn-sm">
                            <i class="bi bi-trash"></i> Eliminar
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>

    <dialog class="dialog" id="dialogProducto" aria-labelledby="dialogProductoTitulo">
        <div class="dialog-header">
            <h1 class="dialog-title" id="dialogProductoTitulo">Datos del Producto</h1>
            <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Cerrar"></button>
        </div>
        <form>
            <div class="dialog-body vstack gap-3">
                <div>
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" required>
                </div>
                <div>
                    <label for="categoria" class="form-label">Categoria</label>
                    <select class="form-control" id="categoria">
                        <option>Computacion</option>
                        <option>Accesorios</option>
                        <option>Audio</option>
                    </select>
                </div>
                <div class="hstack gap-3">
                    <div class="flex-fill">
                        <label for="precio" class="form-label">Precio</label>
                        <input type="number" class="form-control" id="precio" step="0.01">
                    </div>
                    <div class="flex-fill">
                        <label for="stock" class="form-label">Stock</label>
                        <input type="number" class="form-control" id="stock">
                    </div>
                </div>
            </div>
            <div class="dialog-footer">
                <button type="button" class="btn-solid theme-secondary" data-bs-dismiss="dialog">Cancelar</button>
                <button type="button" class="btn-solid theme-primary" data-bs-dismiss="dialog">Guardar</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
